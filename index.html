<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos and Audios</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: cyan;
        }

        h2 {
            color: yellow;
            margin-top: 20px;
        }

        .media-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 10px;
        }

        .media-box {
            background-color: #222;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid white;
        }

        .media-box iframe {
            width: 100%;
            height: 160px;
            border-radius: 6px;
        }

        audio {
            width: 100%;
        }

        h3 {
            color: lightgreen;
            margin: 5px;
        }

        @media (max-width: 700px) {
            .media-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <h1>My Videos and Audios</h1>

    <h2>🎬 Videos</h2>

    <div class="media-container">
        <div class="media-box">
            <h3>Video 1</h3>
            <iframe src="https://www.youtube.com/embed/JqFzhcWo3EU" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>

        <div class="media-box">
            <h3>Video 2</h3>
            <iframe src="https://www.youtube.com/embed/E0Pdo2st89g" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>

        <div class="media-box">
            <h3>Video 3</h3>
            <iframe src="https://www.youtube.com/embed/gCm5WFld2fk" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <div class="media-box">
            <h3>Video 4</h3>
            <iframe src="https://www.youtube.com/embed/RhRiIshrDv8" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>      
<div class="media-box">
    <h3>Video 5</h3>
    <iframe src="https://www.youtube.com/embed/XeGdY8RoxQY" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</div>
    </div>
    <h2>🎵 Audios</h2>
    <div class="media-container">
        <div class="media-box">
            <h3>Audio 1</h3>
            <audio controls>
                <source src="audio1.mp3" type="audio/mpeg">
            </audio>
        </div>
        <div class="media-box">
            <h3>Audio 2</h3>
            <audio controls>
                <source src="audio2.mp3" type="audio/mpeg">
            </audio>
        </div>
        <div class="media-box">
            <h3>Audio 3</h3>
            <audio controls>
                <source src="audio3.mp3" type="audio/mpeg">
            </audio>
        </div>
        <div class="media-box">
            <h3>Audio 4</h3>
            <audio controls>
                <source src="audio4.mp3" type="audio/mpeg">
            </audio>
        </div>
        <div class="media-box">
            <h3>Audio 5</h3>
            <audio controls>
                <source src="audio5.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>

</body>
</html>
